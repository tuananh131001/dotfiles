# TokyoNight, plus a [remap] for protan (red-blind) eyes: Claude Code's
# "dark-daltonized" diff rows are hard-coded truecolor, too close to this
# background, and its dark red reads as black. Drawn instead as blue (added)
# and amber (removed); each changed word ~2:1 lighter than its row.
[colors]
foreground = "#c0caf5"
background = "#1a1b26"
cursor_bg = "#c0caf5"
cursor_fg = "#15161e"
selection_bg = "#33467c"
selection_fg = "#c0caf5"
ansi = ["#15161e", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#a9b1d6"]
brights = ["#414868", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#c0caf5"]

[remap]
"#004466" = "#1a395e"   # added line
"#0077b3" = "#3068ab"   # added word
"#660000" = "#533109"   # removed line
"#b30000" = "#94580f"   # removed word
"#3e2c2c" = "#45351c"   # removed line, dimmed
