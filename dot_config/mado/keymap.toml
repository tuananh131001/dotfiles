"up" = "move-focus up"                      # focus up
"l" = "move-focus right"                    # focus right
"right" = "move-focus right"                # focus right
"n" = ["new-pane", "mode locked"]           # new pane
"r" = ["new-pane right", "mode locked"]     # new pane right
"v" = ["new-pane right", "mode locked"]     # new pane right
"w" = ["toggle-floating", "mode locked"]    # show/hide floating
"x" = ["close-pane", "mode locked"]         # close pane
"Z" = ["toggle-frames", "mode locked"]      # pane frames
"tab" = "focus-next"                        # next pane
"c" = "mode rename-pane"                    # rename pane
