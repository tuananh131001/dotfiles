"l" = "next-tab"                           # next tab
"down" = "next-tab"                        # next tab
"right" = "next-tab"                       # next tab
"n" = ["new-tab", "mode locked"]           # new tab
"t" = ["new-tab", "mode locked"]           # new tab
"s" = ["toggle-sync", "mode locked"]       # sync input
"x" = ["close-tab", "mode locked"]         # close tab
"1" = ["go-to-tab 1", "mode locked"]       # tab 1
"2" = ["go-to-tab 2", "mode locked"]       # tab 2
"3" = ["go-to-tab 3", "mode locked"]       # tab 3
"4" = ["go-to-tab 4", "mode locked"]       # tab 4
"5" = ["go-to-tab 5", "mode locked"]       # tab 5
"6" = ["go-to-tab 6", "mode locked"]       # tab 6
"7" = ["go-to-tab 7", "mode locked"]       # tab 7
"8" = ["go-to-tab 8", "mode locked"]       # tab 8
"9" = ["go-to-tab 9", "mode locked"]       # tab 9
"[" = ["break-pane-left", "mode locked"]   # pane to tab left
"]" = ["break-pane-right", "mode locked"]  # pane to tab right
"tab" = "toggle-tab"                       # last tab
"r" = "mode rename-tab"                    # rename tab
"," = "mode rename-tab"                    # rename tab
"T" = "mode locked"                        # back to locked
"enter" = "mode locked"                    # back to locked
"esc" = "mode locked"                      # back to locked
leader = "mode locked"                     # back to locked

