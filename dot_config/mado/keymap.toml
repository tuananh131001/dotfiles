"left" = "move-pane left"    # move left
"j" = "move-pane down"       # move down
"down" = "move-pane down"    # move down
"k" = "move-pane up"         # move up
"up" = "move-pane up"        # move up
"l" = "move-pane right"      # move right
"right" = "move-pane right"  # move right
"n" = "move-pane"            # move to next
"tab" = "move-pane"          # move to next
"N" = "move-pane-backwards"  # move to previous
"m" = "mode locked"          # back to locked
"enter" = "mode locked"      # back to locked
"esc" = "mode locked"        # back to locked
leader = "mode locked"       # back to locked

# SESSION. Other keys do nothing. Nothing is bound.
[session]

# SCROLL. Other keys do nothing. Nothing is bound.
[scroll]

# ENT-SEARCH. Other keys type into the line.
[enter-search]
"enter" = "mode search"   # search mode
"Cmd g" = "mode search"   # search mode
"esc" = "mode locked"     # back to locked
"Ctrl c" = "mode locked"  # back to locked
leader = "mode locked"    # back to locked

# SEARCH. Other keys do nothing.
[search]
"c" = "search-toggle-option case-sensitivity"  # match case
"d" = "half-page-scroll-down"                 # half page down
"Ctrl d" = "half-page-scroll-down"            # half page down
"g" = "scroll-to-top"                         # to the top
"Home" = "scroll-to-top"                      # to the top
"h" = "page-scroll-up"                        # page up
"left" = "page-scroll-up"                     # page up
"PageUp" = "page-scroll-up"                   # page up
"Ctrl b" = "page-scroll-up"                   # page up
"j" = "scroll-down"                           # scroll down
"down" = "scroll-down"                        # scroll down
"Ctrl e" = "scroll-down"                      # scroll down
"k" = "scroll-up"                             # scroll up
"up" = "scroll-up"                            # scroll up
"Ctrl y" = "scroll-up"                        # scroll up
"l" = "page-scroll-down"                      # page down
"space" = "page-scroll-down"                  # page down
"right" = "page-scroll-down"                  # page down
"PageDown" = "page-scroll-down"               # page down
"Ctrl f" = "page-scroll-down"                 # page down
"n" = "search up"                             # next match above
"Cmd g" = "search up"                         # next match above
"o" = "search-toggle-option whole-word"       # whole words
"q" = ["scroll-to-bottom", "mode locked"]     # to the bottom
"esc" = ["scroll-to-bottom", "mode locked"]   # to the bottom
"Ctrl c" = ["scroll-to-bottom", "mode locked"]  # to the bottom
"u" = "half-page-scroll-up"                   # half page up
