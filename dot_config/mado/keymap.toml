# Mado's keymap (config.toml's `keymap` says where it is read from,
# ~/.config/mado/keymap.toml by default). Written by `mado keys --template`.
# Mado reads it again whenever it is saved; a broken file keeps the last
# good keymap and says why at the bottom of the window.
#
# preset = "none": this file is the whole keymap, so deleting a line
# unbinds its key. (preset = "mado" starts from the built-in map instead,
# and the file only changes it; "unbind" then drops a built-in bind.)
#
# leader-key is the leader: it opens leader mode, pressed again it goes
# to the program, and it leaves the other modes. Wherever `leader` is a
# key below, it means that chord, so changing leader-key moves them all.
#
# Keys are spelled modifiers first: "Ctrl g", "Alt J" (Alt-Shift-j),
# "Cmd D" (⌘⇧D), "Cmd Shift enter". Named keys: left right up down tab
# enter esc backspace space PageUp PageDown Home End F1 to F12.
#
# A bind runs a command, or a list of them in order. A command is an
# action, "mode NAME" or one of the window's own commands. An action
# leaves the mode it ran in only with a "mode locked" after it.
# [[shared]] blocks bind keys in several modes at once:
#   [[shared]]
#   except = ["locked", "enter-search", "rename-tab", "rename-pane"]
#   binds = { "Ctrl y" = "mode copy" }
#
# Window commands: send palette agents sessions projects close-window
#   edit-config pane-hints agent-jump quick-select quick-open
# Modes: locked leader normal pane tab resize move session scroll enter-search
#   search rename-tab rename-pane hints quick-select copy
# Motions (copy-move): left right up down word-forward word-backward word-end
#   big-word-forward big-word-backward big-word-end line-start first-non-blank
#   line-end top bottom view-top view-middle view-bottom half-page-up
#   half-page-down page-up page-down
# Actions, as `mado action` takes them too:
#   new-pane [left|right|up|down] [--floating] [--cwd DIR] [--name NAME] [-- COMMAND...]
#   close-pane
#   move-focus DIR
#   move-focus-or-tab DIR
#   nav DIR
#   focus-next
#   focus-previous
#   focus-last
#   focus-pane ID
#   toggle-fullscreen
#   toggle-floating
#   toggle-embed
#   toggle-frames
#   new-tab [--cwd DIR] [NAME]
#   close-tab
#   go-to-tab N
#   next-tab
#   previous-tab
#   toggle-tab
#   break-pane
#   break-pane-left
#   break-pane-right
#   resize increase|decrease [DIR]
#   move-pane [DIR]
#   move-pane-backwards
#   toggle-sync
#   next-swap-layout
#   previous-swap-layout
#   rename-tab NAME
#   rename-pane NAME
#   undo-rename-tab
#   undo-rename-pane
#   scroll-up
#   scroll-down
#   half-page-scroll-up
#   half-page-scroll-down
#   page-scroll-up
#   page-scroll-down
#   scroll-to-top
#   scroll-to-bottom
#   search up|down
#   search-toggle-option case-sensitivity|whole-word|wrap
#   copy-move MOTION
#   copy-select char|line|block
#   copy-yank
#   edit-scrollback
#   edit-file PATH [LINE]
#   detach
#   quit

preset = "none"
leader-key = "Ctrl g"

# Every mode. A mode's own bind of the same key wins.
[global]
"Cmd d" = ["new-pane right", "mode locked"]   # new pane right
"Cmd j" = ["agent-jump", "mode locked"]       # agent jump: the one that needs you
"Cmd o" = ["projects", "mode locked"]         # projects: open one here
"Cmd p" = "pane-hints"                        # pane hints: go to a pane
"Cmd t" = ["new-tab", "mode locked"]          # new tab
"Cmd w" = ["close-pane", "mode locked"]       # close pane
"Cmd A" = "agents"                            # every agent, to jump to
"Cmd G" = ["new-pane --floating --name agents -- agents-pick", "mode locked"]  # agents-pick: jump, preview, close
"Cmd C" = "quick-select"                      # quick select: copy a URL, path, hash
"Cmd D" = ["new-pane down", "mode locked"]    # new pane below
"Cmd E" = ["edit-scrollback", "mode locked"]  # scrollback in editor
"Cmd N" = ["new-pane", "mode locked"]         # new pane
"Cmd O" = ["sessions", "mode locked"]         # sessions: switch, new, rename, end
"Cmd P" = "palette"                           # command palette
"Cmd W" = "close-window"                      # close the window (detach)
"Cmd 1" = ["go-to-tab 1", "mode locked"]      # tab 1
"Cmd 2" = ["go-to-tab 2", "mode locked"]      # tab 2
"Cmd 3" = ["go-to-tab 3", "mode locked"]      # tab 3
"Cmd 4" = ["go-to-tab 4", "mode locked"]      # tab 4
"Cmd 5" = ["go-to-tab 5", "mode locked"]      # tab 5
"Cmd 6" = ["go-to-tab 6", "mode locked"]      # tab 6
"Cmd 7" = ["go-to-tab 7", "mode locked"]      # tab 7
"Cmd 8" = ["go-to-tab 8", "mode locked"]      # tab 8
"Cmd 9" = ["go-to-tab 9", "mode locked"]      # tab 9
"Cmd ," = ["edit-config", "mode locked"]      # edit config.toml
"Cmd [" = ["focus-previous", "mode locked"]   # previous pane
"Cmd ]" = ["focus-next", "mode locked"]       # next pane
"Cmd {" = ["previous-tab", "mode locked"]     # previous tab
"Cmd }" = ["next-tab", "mode locked"]         # next tab
"Cmd Shift enter" = ["toggle-fullscreen", "mode locked"]  # fullscreen
"Cmd Alt w" = ["close-tab", "mode locked"]    # close tab
"Cmd Alt left" = ["move-focus left", "mode locked"]  # focus left
"Cmd Alt down" = ["move-focus down", "mode locked"]  # focus down
"Cmd Alt up" = ["move-focus up", "mode locked"]  # focus up
"Cmd Alt right" = ["move-focus right", "mode locked"]  # focus right
"Cmd Ctrl left" = "resize increase left"      # grow left
"Cmd Ctrl down" = "resize increase down"      # grow down
"Cmd Ctrl up" = "resize increase up"          # grow up
"Cmd Ctrl right" = "resize increase right"    # grow right
"Cmd f" = "mode enter-search"                 # search
"Cmd R" = "mode rename-tab"                   # rename tab
"Cmd Alt r" = "mode rename-pane"              # rename pane

# LOCKED. Other keys go to the program.
[locked]
"Ctrl h" = "nav left"   # focus left (nvim first)
"Ctrl j" = "nav down"   # focus down (nvim first)
"Ctrl k" = "nav up"     # focus up (nvim first)
"Ctrl l" = "nav right"  # focus right (nvim first)
leader = "mode leader"  # leader: one key
"Alt left" = "write \eb"         # word left (ESC b)
"Alt right" = "write \ef"        # word right (ESC f)
"Cmd left" = "write \x01"        # start of line (^A)
"Cmd right" = "write \x05"       # end of line (^E)
"Cmd backspace" = "write \x15"   # delete to start of line (^U)

# LEADER. Other keys go back to locked.
[leader]
"a" = ["agent-jump", "mode locked"]           # agent jump: the one that needs you
"b" = ["break-pane", "mode locked"]           # pane to new tab
"d" = "detach"                                # detach
"e" = ["edit-scrollback", "mode locked"]      # scrollback in editor
"f" = ["projects", "mode locked"]             # projects: open one here
"h" = ["previous-tab", "mode locked"]         # previous tab
"l" = ["next-tab", "mode locked"]             # next tab
"n" = ["new-pane", "mode locked"]             # new pane
"o" = ["focus-next", "mode locked"]           # next pane
"q" = "pane-hints"                            # pane hints: go to a pane
"s" = ["new-pane down", "mode locked"]        # new pane below
"t" = ["new-tab", "mode locked"]              # new tab
"u" = "quick-open"                            # quick open: a URL or path on screen
"v" = ["new-pane right", "mode locked"]       # new pane right
"w" = ["sessions", "mode locked"]             # sessions: switch, new, rename, end
"x" = ["close-pane", "mode locked"]           # close pane
"z" = ["toggle-fullscreen", "mode locked"]    # fullscreen
"A" = ["agents", "mode locked"]               # every agent, to jump to
"E" = ["toggle-embed", "mode locked"]         # float/embed pane
"F" = ["toggle-floating", "mode locked"]      # show/hide floating
"X" = ["close-tab", "mode locked"]            # close tab
"1" = ["go-to-tab 1", "mode locked"]          # tab 1
"2" = ["go-to-tab 2", "mode locked"]          # tab 2
"3" = ["go-to-tab 3", "mode locked"]          # tab 3
"4" = ["go-to-tab 4", "mode locked"]          # tab 4
"5" = ["go-to-tab 5", "mode locked"]          # tab 5
"6" = ["go-to-tab 6", "mode locked"]          # tab 6
"7" = ["go-to-tab 7", "mode locked"]          # tab 7
"8" = ["go-to-tab 8", "mode locked"]          # tab 8
"9" = ["go-to-tab 9", "mode locked"]          # tab 9
"space" = "quick-select"                      # quick select: copy a URL, path, hash
":" = ["palette", "mode locked"]              # command palette
";" = ["focus-last", "mode locked"]           # last pane
"left" = ["move-focus left", "mode locked"]   # focus left
"down" = ["move-focus down", "mode locked"]   # focus down
"up" = ["move-focus up", "mode locked"]       # focus up
"right" = ["move-focus right", "mode locked"]  # focus right
"tab" = ["toggle-tab", "mode locked"]         # last tab
leader = ["mode locked", "send"]              # pass the key to the program
"c" = "mode rename-pane"                      # rename pane
"m" = "mode move"                             # move mode
"p" = "mode pane"                             # pane mode
"r" = "mode resize"                           # resize mode
"T" = "mode tab"                              # tab mode
"," = "mode rename-tab"                       # rename tab
"/" = "mode enter-search"                     # search
"[" = "mode copy"                             # copy mode
"enter" = "mode locked"                       # back to locked
"esc" = "mode locked"                         # back to locked
"Ctrl c" = "mode locked"                      # back to locked

# NORMAL. Other keys do nothing. Nothing is bound.
[normal]

# PANE. Other keys do nothing.
[pane]
"d" = ["new-pane down", "mode locked"]      # new pane below
"s" = ["new-pane down", "mode locked"]      # new pane below
"e" = ["toggle-embed", "mode locked"]       # float/embed pane
"f" = ["toggle-fullscreen", "mode locked"]  # fullscreen
"z" = ["toggle-fullscreen", "mode locked"]  # fullscreen
"h" = "move-focus left"                     # focus left
"left" = "move-focus left"                  # focus left
"j" = "move-focus down"                     # focus down
"down" = "move-focus down"                  # focus down
