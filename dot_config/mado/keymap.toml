"w" = "search-toggle-option wrap"             # wrap around
"G" = "scroll-to-bottom"                      # to the bottom
"End" = "scroll-to-bottom"                    # to the bottom
"N" = "search down"                           # next match below
"Cmd G" = "search down"                       # next match below
"/" = "mode enter-search"                     # search
"enter" = "mode locked"                       # back to locked
leader = "mode locked"                        # back to locked

# RENAME-TAB. Other keys type into the line.
[rename-tab]
"esc" = ["undo-rename-tab", "mode locked"]    # cancel rename
"Ctrl c" = ["undo-rename-tab", "mode locked"]  # cancel rename
"enter" = "mode locked"                       # back to locked
leader = "mode locked"                        # back to locked

# RENAME-PANE. Other keys type into the line.
[rename-pane]
"esc" = ["undo-rename-pane", "mode locked"]   # cancel rename
"Ctrl c" = ["undo-rename-pane", "mode locked"]  # cancel rename
"enter" = "mode locked"                       # back to locked
leader = "mode locked"                        # back to locked

# HINTS. Other keys go back to locked.
[hints]
